[defaults]
# Holds only localhost; the playbook asks for the router at run time.
inventory = inventory/hosts.yml
filter_plugins = filter_plugins
collections_paths = ./collections:~/.ansible/collections:/usr/share/ansible/collections
retry_files_enabled = False
host_key_checking = False
gathering = explicit
forks = 5
timeout = 30

[persistent_connection]
# Long-running commands (image copy, verify) override this per task.
command_timeout = 120
connect_timeout = 60
