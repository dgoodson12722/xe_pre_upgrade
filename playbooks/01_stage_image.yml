---
# IOS XE upgrade, part 1: get the image onto bootflash and verify it.
# One device per run. Everything is asked interactively.
#
#   ansible-playbook stage_image.yml
#
# Steps
#   1. Ask for the device IP or FQDN
#   2. Ask for username and password, then check SSH, log in, show hostname
#      and version, and confirm it is the right router
#   3. Ask for the image file name (as on the Cisco download page)
#   4. Ask for the MD5 or SHA512 hash
#   5. Check whether the image is already on bootflash
#   6. If not: you copy it, or the playbook copies it (push from this server
#      or the router pulls from an SCP server), after a free-space check
#   7. Verify the hash; on a mismatch, you or the playbook deletes the bad file

# ---------------------------------------------------------------------------
# Steps 1 and 2: collect device and credentials, then check SSH
# ---------------------------------------------------------------------------
- name: Steps 1 and 2 - device and credentials
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: device
      prompt: "Step 1 - Device IP or FQDN"
      private: false
    - name: device_user
      prompt: "Step 2 - Username"
      private: false
    - name: device_password
      prompt: "Step 2 - Password"
      private: true

  tasks:
    - name: Check the answers are not empty
      ansible.builtin.assert:
        that:
          - device | trim | length > 0
          - device_user | trim | length > 0
          - device_password | length > 0
        fail_msg: "Device, username and password are all required."
      no_log: true

    - name: Step 2 - check SSH (port 22) answers on {{ device }}
      ansible.builtin.wait_for:
        host: "{{ device | trim }}"
        port: 22
        timeout: 15
      register: ssh_check
      ignore_errors: true

    - name: Stop if SSH does not answer
      ansible.builtin.fail:
        msg: "No answer on {{ device | trim }} port 22. Check the address and that this server can reach it."
      when: ssh_check is failed

    - name: Add the device for the next play
      ansible.builtin.add_host:
        name: "{{ device | trim }}"
        groups: target
        ansible_host: "{{ device | trim }}"
        ansible_user: "{{ device_user | trim }}"
        ansible_password: "{{ device_password }}"
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
      no_log: true

# ---------------------------------------------------------------------------
# Steps 2 (login) to 7 on the device
# ---------------------------------------------------------------------------
- name: Steps 2 to 7 - stage and verify the image
  hosts: target
  gather_facts: false

  vars:
    # Free space required when the router pulls the file (its size is not known
    # in advance). A push uses the real file size from this server instead.
    pull_min_free_bytes: 2147483648
    # Long-running commands: copying and hashing a ~750 MB image.
    copy_timeout: 3600
    verify_timeout: 1200

  tasks:
    # ----- Step 2: log in, show hostname and version, confirm --------------
    - name: Step 2 - log in and read show version
      cisco.ios.ios_command:
        commands: show version
      register: show_version

    - name: Step 2 - record hostname and version
      ansible.builtin.set_fact:
        device_hostname: "{{ (show_version.stdout[0] | regex_search('^(\\S+) uptime is', '\\1', multiline=True) or ['unknown']) | first }}"
        device_version: "{{ (show_version.stdout[0] | regex_search('Cisco IOS XE Software, Version (\\S+)', '\\1') or ['unknown']) | first }}"

    - name: Step 2 - is this the right router?
      ansible.builtin.pause:
        prompt: |

          Connected to {{ inventory_hostname }}
            Hostname: {{ device_hostname }}
            Version:  {{ device_version }}

          Is this the right router? (yes/no)
      register: confirm_router

    - name: Stop if it is not the right router
      ansible.builtin.fail:
        msg: "Stopped: you said {{ device_hostname }} is not the right router."
      when: confirm_router.user_input | trim | lower not in ['y', 'yes']

    # ----- Step 3: image file name ----------------------------------------
    - name: Step 3 - image file name
      ansible.builtin.pause:
        prompt: "Step 3 - Image file name as shown on the Cisco download page (e.g. c8000aep-universalk9.17.12.08.SPA.bin)"
      register: image_answer

    - name: Step 3 - check the file name and work out the version
      ansible.builtin.set_fact:
        image_file: "{{ image_answer.user_input | trim }}"
        image_version: "{{ (image_answer.user_input | trim | regex_search('\\.(\\d+\\.\\d+\\.\\d+[a-z]?)\\.', '\\1') or ['']) | first }}"

    - name: Step 3 - stop if the name does not look like an IOS XE image
      ansible.builtin.assert:
        that:
          - image_file is match('^[A-Za-z0-9._-]+\.bin$')
          - image_version | length > 0
        fail_msg: "'{{ image_file }}' does not look like an IOS XE image name (expected something like c8000aep-universalk9.17.12.08.SPA.bin)."
        success_msg: "Image {{ image_file }}, version {{ image_version }}"

    # ----- Step 4: hash ----------------------------------------------------
    - name: Step 4 - MD5 or SHA512 hash
      ansible.builtin.pause:
        prompt: "Step 4 - MD5 or SHA512 hash from the Cisco download page"
      register: hash_answer

    - name: Step 4 - work out the hash type from its length
      ansible.builtin.set_fact:
        image_hash: "{{ hash_answer.user_input | trim | lower }}"
        hash_type: >-
          {{ {32: 'md5', 128: 'sha512'}.get(hash_answer.user_input | trim | length, 'unknown') }}

    - name: Step 4 - stop if the hash is not a valid MD5 or SHA512
      ansible.builtin.assert:
        that:
          - hash_type in ['md5', 'sha512']
          - image_hash is match('^[0-9a-f]+$')
        fail_msg: "The hash must be 32 (MD5) or 128 (SHA512) hex characters; you entered {{ image_hash | length }} characters."
        success_msg: "Hash type: {{ hash_type | upper }}"

    # ----- Step 5: already on bootflash? ------------------------------------
    - name: Step 5 - list bootflash
      cisco.ios.ios_command:
        commands: "dir bootflash:"
      register: dir_before

    - name: Step 5 - is the image there?
      ansible.builtin.set_fact:
        image_on_flash: "{{ dir_before.stdout[0] is search('\\s' ~ (image_file | regex_escape) ~ '\\s*$', multiline=True) }}"
        bytes_free: "{{ (dir_before.stdout[0] | regex_search('\\((\\d+) bytes free\\)', '\\1') or ['0']) | first | int }}"

    - name: Step 5 - result
      ansible.builtin.debug:
        msg: >-
          {{ image_file }} is {{ 'already' if image_on_flash | bool else 'not' }} on bootflash.
          {{ 'Skipping to step 7.' if image_on_flash | bool else 'Going to step 6.' }}
          Free space: {{ bytes_free }} bytes.

    # ----- Step 6: get the image onto bootflash ----------------------------
    - name: Step 6 - copy the image
      when: not image_on_flash | bool
      block:
        - name: Step 6 - who copies the file?
          ansible.builtin.pause:
            prompt: |

              {{ image_file }} is not on bootflash of {{ device_hostname }}.
              Will you copy it yourself, or should the playbook copy it? (me/playbook)
          register: copy_who

        - name: Step 6 - check the answer
          ansible.builtin.assert:
            that: copy_who.user_input | trim | lower in ['me', 'playbook']
            fail_msg: "Please answer 'me' or 'playbook'."

        # --- You copy it ---
        - name: Step 6 - wait while you copy the file
          when: copy_who.user_input | trim | lower == 'me'
          ansible.builtin.pause:
            prompt: "Copy {{ image_file }} to bootflash: on {{ device_hostname }}, then press Enter"

        # --- The playbook copies it ---
        - name: Step 6 - playbook copy
          when: copy_who.user_input | trim | lower == 'playbook'
          block:
            - name: Step 6 - push or pull?
              ansible.builtin.pause:
                prompt: |

                  push = send the file from this Ansible server to the router
                  pull = the router fetches it from an SCP server
                  Push or pull? (push/pull)
              register: copy_how

            - name: Step 6 - check the answer
              ansible.builtin.assert:
                that: copy_how.user_input | trim | lower in ['push', 'pull']
                fail_msg: "Please answer 'push' or 'pull'."

            # Push from this server
            - name: Step 6 - push
              when: copy_how.user_input | trim | lower == 'push'
              block:
                - name: Step 6 - where is the image on this server?
                  ansible.builtin.pause:
                    prompt: "Directory (or full path) of {{ image_file }} on this Ansible server"
                  register: local_path_answer

                - name: Step 6 - build the local path
                  ansible.builtin.set_fact:
                    local_image: >-
                      {{ local_path_answer.user_input | trim
                         if (local_path_answer.user_input | trim) is search(image_file | regex_escape ~ '$')
                         else (local_path_answer.user_input | trim | regex_replace('/+$', '')) ~ '/' ~ image_file }}

                - name: Step 6 - check the file exists here
                  ansible.builtin.stat:
                    path: "{{ local_image }}"
                    get_checksum: false
                  register: local_stat
                  delegate_to: localhost

                - name: Step 6 - stop if the file is missing
                  ansible.builtin.assert:
                    that: local_stat.stat.exists and local_stat.stat.isreg
                    fail_msg: "{{ local_image }} not found on this server."

                - name: Step 6 - stop if bootflash is too small
                  ansible.builtin.assert:
                    that: bytes_free | int >= local_stat.stat.size | int
                    fail_msg: >-
                      Not enough space on bootflash: {{ bytes_free }} bytes free,
                      {{ local_stat.stat.size }} bytes needed. Nothing was copied.

                - name: Step 6 - push {{ image_file }} over SCP (this can take a while)
                  ansible.netcommon.net_put:
                    src: "{{ local_image }}"
                    dest: "bootflash:{{ image_file }}"
                    protocol: scp
                  vars:
                    ansible_command_timeout: "{{ copy_timeout }}"

            # Router pulls from an SCP server
            - name: Step 6 - pull
              when: copy_how.user_input | trim | lower == 'pull'
              block:
                - name: Step 6 - stop if bootflash is too small
                  ansible.builtin.assert:
                    that: bytes_free | int >= pull_min_free_bytes | int
                    fail_msg: >-
                      Not enough space on bootflash: {{ bytes_free }} bytes free,
                      at least {{ pull_min_free_bytes }} bytes needed. Nothing was copied.

                - name: Step 6 - SCP server
                  ansible.builtin.pause:
                    prompt: "SCP server IP or FQDN"
                  register: scp_server

                - name: Step 6 - directory on the SCP server
                  ansible.builtin.pause:
                    prompt: "Directory of {{ image_file }} on the SCP server (e.g. /images)"
                  register: scp_dir

                - name: Step 6 - SCP server username
                  ansible.builtin.pause:
                    prompt: "SCP server username"
                  register: scp_user

                - name: Step 6 - SCP server password
                  ansible.builtin.pause:
                    prompt: "SCP server password"
                    echo: false
                  register: scp_password
                  no_log: true

                - name: Step 6 - router pulls {{ image_file }} (this can take a while)
                  cisco.ios.ios_command:
                    commands:
                      - command: >-
                          copy scp://{{ scp_user.user_input | trim }}@{{ scp_server.user_input | trim
                          }}/{{ scp_dir.user_input | trim | regex_replace('^/+', '') | regex_replace('/+$', '')
                          }}/{{ image_file }} bootflash:{{ image_file }}
                        prompt:
                          - 'Destination filename \[.*\]\?'
                          - '[Pp]assword:'
                        answer:
                          - "\r"
                          - "{{ scp_password.user_input }}"
                  vars:
                    ansible_command_timeout: "{{ copy_timeout }}"
                  no_log: true

        # --- Either way: check the file arrived ---
        - name: Step 6 - list bootflash again
          cisco.ios.ios_command:
            commands: "dir bootflash:"
          register: dir_after

        - name: Step 6 - stop if the image is still not there
          ansible.builtin.assert:
            that: dir_after.stdout[0] is search('\\s' ~ (image_file | regex_escape) ~ '\\s*$', multiline=True)
            fail_msg: "{{ image_file }} is still not on bootflash. Stopping."
            success_msg: "{{ image_file }} is on bootflash."

    # ----- Step 7: verify the hash -----------------------------------------
    - name: Step 7 - verify {{ hash_type | upper }} (this can take a few minutes)
      cisco.ios.ios_command:
        commands: "verify /{{ hash_type }} bootflash:{{ image_file }} {{ image_hash }}"
      vars:
        ansible_command_timeout: "{{ verify_timeout }}"
      register: verify_result
      ignore_errors: true  # a mismatch is reported as an error by the router

    - name: Step 7 - result
      ansible.builtin.set_fact:
        hash_ok: "{{ verify_result is succeeded and (verify_result.stdout | default(['']) | first) is search('Verified') }}"

    - name: Step 7 - hash matches
      ansible.builtin.debug:
        msg: "{{ hash_type | upper }} verified for {{ image_file }} on {{ device_hostname }}. Steps 1 to 7 complete."
      when: hash_ok | bool

    - name: Step 7 - hash does not match
      when: not hash_ok | bool
      block:
        - name: Step 7 - show what the router said
          ansible.builtin.debug:
            msg: "{{ verify_result.stdout | default(verify_result.msg | default('no output')) }}"

        - name: Step 7 - who deletes the bad file?
          ansible.builtin.pause:
            prompt: |

              The {{ hash_type | upper }} of bootflash:{{ image_file }} does not match.
              Will you delete the file yourself, or should the playbook delete it? (me/playbook)
          register: delete_who

        - name: Step 7 - delete the bad file
          when: delete_who.user_input | trim | lower == 'playbook'
          cisco.ios.ios_command:
            commands: "delete /force bootflash:{{ image_file }}"

        - name: Step 7 - confirm it is gone
          when: delete_who.user_input | trim | lower == 'playbook'
          cisco.ios.ios_command:
            commands: "dir bootflash:"
          register: dir_deleted
          failed_when: dir_deleted.stdout[0] is search('\\s' ~ (image_file | regex_escape) ~ '\\s*$', multiline=True)

        - name: Step 7 - stop
          ansible.builtin.fail:
            msg: >-
              Hash mismatch for {{ image_file }}.
              {{ 'The playbook deleted the file.' if delete_who.user_input | trim | lower == 'playbook'
                 else 'The file was left on bootflash for you to delete.' }}
              Copy it again and re-run.
